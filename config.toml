# hackathon-radar configuration

[interests]
# Free-text profile used by Claude to judge relevance. Edit freely.
profile = """
This channel serves tech undergraduate students in Singapore who want to level up:
CS/engineering students, self-taught devs, and student builders.

Highest priority:
- Hackathons and buildathons, especially AI/ML/LLM ones and events by model providers
  (Anthropic, OpenAI, Google, AWS) — student-friendly or open-entry preferred
- Tech networking where students can learn and meet people: dev/AI meetups, builder
  nights, tech talks, demo days, founder and startup events
- Programs that upgrade students: accelerators, fellowships, bootcamps, and mentorship
  programs open to undergrads

Not a fit: non-tech lifestyle events (fitness, arts, wellness), marketing or sales
events, pure crypto/web3-only events, senior-executive conferences, and anything
requiring years of professional experience or expensive tickets.
"""
# Used by the keyword fallback scorer when no Anthropic API key is configured.
keywords = [
    "ai", "ml", "machine learning", "llm", "genai", "generative",
    "agent", "student", "university", "startup", "founder", "pitch",
    "meetup", "networking", "demo day", "accelerator", "builder", "developer",
    "hackathon", "buildathon", "workshop", "tech talk", "fellowship", "bootcamp",
]
# Events scoring below this (0-10) are recorded but not notified.
min_score = 6

[scope]
mode = "sg_plus_online"   # "sg_plus_online" | "sg_only" | "global"
home_country = "SG"
home_city = "singapore"
include_full = false      # true also posts full / waitlist-only events (where known)

[scoring]
model = "claude-haiku-4-5"   # cheapest model; $1 / $5 per 1M input / output tokens
batch_size = 20

[enrich]
# Per-event page fetch + Claude extraction of team size, deadline, and challenge
# brief. Runs ONLY for events about to be posted. Set false to disable entirely
# (cards then show source data only) if you want the absolute minimum spend.
enabled = true

[sources.devpost]
enabled = true
pages = 2                 # pages of ~10 hackathons each, newest first

[sources.mlh]
enabled = true

[sources.luma]
enabled = true
city = "singapore"        # lu.ma/<city> discover page
limit = 50

[sources.watchlist]
# Organizer pages that post events nowhere else: company hackathon pages, school
# clubs, uni departments. Any URL works — Claude extracts events from the page
# text, and only re-reads a page when its content changes (near-zero idle cost).
# Note: JS-only pages (content invisible without a browser) can't be watched.
enabled = true
pages = [
    "https://www.nushackers.org/",
]
assume_country = "SG"     # events from these pages count as local unless stated

[notify]
max_per_run = 10           # cap per run so a single run can't flood the channel
max_per_day = 15           # rolling 24h cap across runs (guards against DB loss)
duplicate_title_days = 14  # skip events whose title matches a recent notification
quiet_start = 23           # deliver silently (no ping) from 23:00...
quiet_end = 8              # ...to 08:00; set both equal to disable
timezone = "Asia/Singapore"
send_interval_seconds = 30 # gap between messages so a batch isn't one burst; 0 = off
