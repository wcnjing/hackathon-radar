# hackathon-radar configuration

[interests]
# Free-text profile used by Claude to judge relevance. Edit freely.
profile = """
This channel serves tech undergraduate students in Singapore who want to level up:
CS/engineering students, self-taught devs, and student builders.

Highest priority — ACTIONABLE events where students build, compete, or apply:
- Hackathons, buildathons, datathons, and competitions — especially AI/ML/LLM ones
  and events by model providers (Anthropic, OpenAI, Google, AWS); student-friendly
  or open-entry preferred
- Programs that upgrade students: accelerators, fellowships, bootcamps, mentorship
  programs open to undergrads
- Hands-on workshops where you leave having built something

Low priority — networking sessions, talks, panels, mixers, demo days: score these
5 or below unless truly exceptional (rare direct access to a major company or
famous builders, e.g. an Anthropic/OpenAI community night). A generic meetup,
founders' breakfast, or tech talk is NOT worth a notification.

Not a fit: non-tech lifestyle events (fitness, arts, wellness), marketing or sales
events, pure crypto/web3-only events, senior-executive conferences, and anything
requiring years of professional experience or expensive tickets.
"""
# Used by the keyword fallback scorer when no Anthropic API key is configured.
keywords = [
    "ai", "ml", "machine learning", "llm", "genai", "generative",
    "agent", "student", "university", "startup", "founder", "pitch",
    "meetup", "networking", "demo day", "accelerator", "builder", "developer",
    "hackathon", "buildathon", "workshop", "tech talk", "fellowship", "bootcamp",
]
# Events scoring below this (0-10) are recorded but not notified.
min_score = 6
# Per-kind overrides: networking/talks must be exceptional to earn a post.
min_score_by_kind = { networking = 8 }

[scope]
mode = "sg_plus_online"   # "sg_plus_online" | "sg_only" | "global"
home_country = "SG"
home_city = "singapore"
include_full = false      # true also posts full / waitlist-only events (where known)

[scoring]
model = "claude-haiku-4-5"   # cheapest model; $1 / $5 per 1M input / output tokens
batch_size = 20

[enrich]
# Per-event page fetch + Claude extraction of team size, deadline, and challenge
# brief. Runs ONLY for events about to be posted. Set false to disable entirely
# (cards then show source data only) if you want the absolute minimum spend.
enabled = true

[sources.devpost]
enabled = true
pages = 2                 # pages of ~10 hackathons each, newest first

[sources.mlh]
enabled = true

[sources.luma]
enabled = true
city = "singapore"        # lu.ma/<city> discover page
limit = 50

[sources.watchlist]
# Organizer pages that post events nowhere else: company hackathon pages, school
# clubs, uni departments. Any URL works — Claude extracts events from the page
# text, and only re-reads a page when its content changes (near-zero idle cost).
# Note: JS-only pages (content invisible without a browser) can't be watched.
# Tip: public Telegram channels work via their t.me/s/<name> preview page.
enabled = true
pages = [
    "https://www.nushackers.org/",
    "https://t.me/s/ntuoss",                          # NTU OSS announcements
    "https://www.janestreet.com/join-jane-street/events/",
    "https://readytradergo.optiver.com/",             # fires when a new edition launches
    "https://www.correlation-one.com/",               # Citadel datathons etc.
]
# Fallback when a page doesn't state an event's country; global pages (Jane
# Street, Correlation One) get per-event countries inferred during extraction.
assume_country = "SG"

[sources.email]
# Dedicated inbox subscribed to event newsletters (EMAIL_ADDRESS /
# EMAIL_APP_PASSWORD in .env and GitHub secrets). Each message is processed
# once; Claude extracts any announced events from the body.
enabled = true
imap_host = "imap.gmail.com"
folder = "INBOX"
max_emails_per_run = 20
assume_country = "SG"

[notify]
# Posting is drip-fed from a queue: sources are fetched every fetch_every_hours,
# notification-worthy events are queued, and each (frequent, short) run posts at
# most ONE queued event — so posts are always >= send_interval_seconds apart.
send_interval_seconds = 1800  # min gap between consecutive channel posts (30 min)
fetch_every_hours = 6         # how often sources are fetched and the queue refilled
max_per_run = 10              # preview cap for --dry-run
max_per_day = 15              # rolling 24h cap (also bounds how much one ingest queues)
duplicate_title_days = 60     # skip events whose title matches a recent notification
# Gate 1 experiment: appends a "looking for a team?" prompt to hackathon cards
# only. Requires a linked discussion group, or there is nowhere to reply.
team_prompt = false
quiet_start = 23              # deliver silently (no ping) from 23:00...
quiet_end = 8                 # ...to 08:00; set both equal to disable
timezone = "Asia/Singapore"
