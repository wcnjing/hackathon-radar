name: radar

on:
  schedule:
    # Every 30 minutes: each run posts at most ONE queued event (30-min drip
    # pacing); sources are only re-fetched every 6 hours (tracked in the DB).
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "Fetch sources now even if the 6h cadence isn't due"
        type: boolean
        default: false

# Never run two radar runs at once — they'd both restore the same seen-events
# DB and double-send. A run that triggers while one is in progress waits for it
# to finish (cancel-in-progress: false) rather than running alongside it.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # lets the keepalive step below re-enable this workflow
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Restore the newest seen-events DB. Restore and save are separate so a
      # failed radar run can still persist any committed DB/state-file writes.
      # run_attempt keeps the save key unique when a failed workflow is rerun.
      - name: Restore seen-events database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-db-

      - name: Run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RADAR_FORCE_FETCH: ${{ inputs.force_fetch && '1' || '' }}
        run: uv run radar run

      - name: Save seen-events database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}

      # Re-enabling ourselves resets GitHub's 60-day inactivity timer, so the
      # schedule survives indefinitely even with no commits.
      # Best-effort: this only has to succeed occasionally to reset the timer,
      # so a transient GitHub API error must not fail the job. The explicit
      # save step above persists data/ even when this or the radar step fails.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/radar.yml/enable" \
            || echo "keepalive failed (non-fatal); the 60-day timer resets on a later run"

# vim: ts=2
