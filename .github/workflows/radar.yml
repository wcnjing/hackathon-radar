name: radar

on:
  schedule:
    # every 6 hours at :03 — 02:03 / 08:03 / 14:03 / 20:03 Singapore time (cron is UTC)
    - cron: "3 */6 * * *"
  workflow_dispatch: {}

# Never run two radar runs at once — they'd both restore the same seen-events
# DB and double-send. A run that triggers while one is in progress waits for it
# to finish (cancel-in-progress: false) rather than running alongside it.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # lets the keepalive step below re-enable this workflow
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Restore the newest seen-events DB; the unique key means the updated
      # DB is saved back at the end of every run.
      - name: Restore seen-events database
        uses: actions/cache@v4
        with:
          path: data
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: uv run radar run

      # Re-enabling ourselves resets GitHub's 60-day inactivity timer, so the
      # schedule survives indefinitely even with no commits.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/radar.yml/enable"

