name: radar

on:
  schedule:
    # every 6 hours at :03 — 02:03 / 08:03 / 14:03 / 20:03 Singapore time (cron is UTC)
    - cron: "3 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: radar

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Restore the newest seen-events DB; the unique key means the updated
      # DB is saved back at the end of every run.
      - name: Restore seen-events database
        uses: actions/cache@v4
        with:
          path: data
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run radar run

# vim: ts=2
