name: ci

# Verifies pull requests. Deliberately has NO secrets and no access to the
# radar's credentials — the test suite is fully offline (fixtures + mocks).
on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Formatting and lint run before the tests: they fail in under a second
      # and tell a contributor exactly what to run, rather than making them
      # wait on the suite to find out a line was too long.
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest -q
