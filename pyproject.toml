[project]
name = "hackathon-radar"
version = "0.1.0"
description = "Auto-curates hackathons and tech events for SG tech students from Devpost, MLH, Luma, watched pages, and a newsletter inbox; drip-posts to Telegram"
readme = "README.md"
authors = [
    { name = "wcnjing", email = "wenjinx2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.3",
]

[project.scripts]
radar = "hackathon_radar.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
