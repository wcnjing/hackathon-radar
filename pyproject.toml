[project]
name = "hackathon-radar"
version = "0.1.0"
description = "Auto-curates hackathons and tech events for SG tech students from Devpost, MLH, Luma, watched pages, and a newsletter inbox; drip-posts to Telegram"
readme = "README.md"
authors = [
    { name = "wcnjing", email = "wenjinx2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
radar = "hackathon_radar.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
# Close to the code's existing shape: only 10 lines exceeded 100 before this
# was added, so adopting it is a small reformat rather than a rewrite.
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than inheriting ruff's defaults, which widen between
# releases — a formatter that changes its mind on upgrade is worse than none.
#   E4/E7/E9, F  real problems: unused imports, undefined names, broken syntax
#   I            import sorting, the usual source of pointless review churn
#   B            bugbear, e.g. mutable default arguments
#   UP           pyupgrade; we are on 3.14, so modern syntax is always available
# Deliberately NOT enabled: BLE001 and S110/S112. The broad `except Exception`
# handlers in scoring.py and enrich.py are intentional degradation paths, and
# flagging them would pressure contributors into removing resilience.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
